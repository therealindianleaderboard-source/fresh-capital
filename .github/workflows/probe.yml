name: probe
on: {workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python probe.py
        env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
